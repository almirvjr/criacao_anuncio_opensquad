name: "ML Anúncios Pipeline"
trigger: "manual"
approval_mode: "batch"

steps:
  - { order: 1,  file: steps/step-01-leitura-planilha.md }
  - { order: 2,  file: steps/step-02-curadoria-produtos.md }
  - { order: 3,  file: steps/step-03-categorizacao.md }
  - { order: 4,  file: steps/step-04-inteligencia-conversao.md }
  - { order: 5,  file: steps/step-04b-checkpoint-dados.md }
  - { order: 6,  file: steps/step-05-copywriting.md }
  - { order: 7,  file: steps/step-06-checkpoint-copy.md }
  - { order: 8,  file: steps/step-07-capas.md }
  - { order: 9,  file: steps/step-08-revisao.md }
  - { order: 10, file: steps/step-09-checkpoint-publicacao.md }
  - { order: 11, file: steps/step-10-publicacao.md }
  - { order: 12, file: steps/step-11-relatorio-final.md }

checkpoints:
  - step-04b-checkpoint-dados
  - step-06-checkpoint-copy
  - step-09-checkpoint-publicacao

# Travas deterministicas (pipeline/validators/).
# BLOQUEANTES: o pipeline NAO avanca se qualquer uma sair com codigo != 0.
# Sao a diferenca entre "o agente lembra" e "o sistema obriga".
gates:
  - id: brief_storyselling
    fase: 1
    script: validators/validar_brief.py --sem-fotos
    roda_em: [step-04, step-04b]
    bloqueia: "brief sem limitacoes[], diagnostico incompleto, ou com review citada que nao existe no _raw/"
  - id: anti_claim_falso
    fase: 2
    script: validators/validar_claims.py --copy --sem-fotos
    roda_em: [step-05, step-08]
    bloqueia: "titulo/descricao que afirma feature inexistente (ex.: balde) ou limitacao do brief nao declarada na descricao"
  - id: ficha_seo
    script: validators/validar_ficha_seo.py
    roda_em: [step-05, step-06, step-08]
    bloqueia: "Marca diferente de so o fornecedor (ou so a marca propria), palavra do Modelo repetida do titulo, Mundiart fora da regra, loja citada fora do lugar"
  - id: capas
    script: validators/capas.py
    roda_em: [step-07]
    bloqueia: "cor sem capa no Cloudinary (etiquetas capa-anuncio + SKU da cor) ou com mais de 10 fotos"

# Gates de imagem arquivados em _arquivo-fotos/ (esteira sem fotos desde 07/10/2026).
