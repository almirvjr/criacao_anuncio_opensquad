name: "ML Anúncios Pipeline"
trigger: "manual"
approval_mode: "batch"

steps:
  - { order: 1,  file: steps/step-01-leitura-planilha.md }
  - { order: 2,  file: steps/step-02-curadoria-produtos.md }
  - { order: 3,  file: steps/step-03-categorizacao.md }
  - { order: 4,  file: steps/step-04-inteligencia-conversao.md }
  - { order: 5,  file: steps/step-04b-checkpoint-dados.md }
  - { order: 6,  file: steps/step-05-copywriting.md }
  - { order: 7,  file: steps/step-06-checkpoint-copy.md }
  - { order: 8,  file: steps/step-07-fotos.md }
  - { order: 9,  file: steps/step-08-revisao.md }
  - { order: 10, file: steps/step-09-checkpoint-publicacao.md }
  - { order: 11, file: steps/step-10-publicacao.md }
  - { order: 12, file: steps/step-11-relatorio-final.md }

checkpoints:
  - step-04b-checkpoint-dados
  - step-06-checkpoint-copy
  - step-09-checkpoint-publicacao

# Travas deterministicas da blindagem StorySelling (pipeline/validators/).
# BLOQUEANTES: o pipeline NAO avanca se qualquer uma sair com codigo != 0.
# Sao a diferenca entre "o agente lembra" e "o sistema obriga".
gates:
  - id: brief_storyselling
    fase: 1
    script: validators/validar_brief.py
    roda_em: [step-04, step-04b]
    bloqueia: "brief sem 10 slots na hierarquia Equilibrado, sem limitacoes[], ou com review citada que nao existe no _raw/"
  - id: anti_claim_falso
    fase: 2
    script: validators/validar_claims.py
    roda_em: [step-04, step-07]
    bloqueia: "overlay que afirma feature inexistente (ex.: balde) ou limitacao nao declarada na foto certa"
  - id: prompt_preso_ao_template
    fase: 3
    script: validators/validar_prompts.py
    roda_em: [step-07]
    bloqueia: "prompt com placeholder nao preenchido, nome fora da funcao canonica do slot, ou slot fixo faltando"
  - id: qa_imagem
    fase: 4
    script: validators/qa_imagens.py
    roda_em: [step-07, step-08]
    bloqueia: "foto != 1200x1200, produto ausente/distorcido, inox dourado (override estreito p/ objeto nao-metalico), ou produto INFIEL (sidecar de composicao com sha fora do manifesto travado -> passar --lock produtos-travados/SKU.json)"
  - id: prompt_nano_banana
    fase: 5
    script: validators/validar_prompt_nano.py (= skills/image-ai-generator/scripts/prompt_lint.py)
    roda_em: [generate.py em TODA geracao, step-07]
    bloqueia: "1a geracao com razao de escala em texto ('1/3 da bancada' -> o modelo ignora) ou JSON cru no prompt; avisa close-up/low-angle/macro. Garante as boas praticas do Nano Banana de forma infalivel (no nivel da ferramenta)."
  - id: produto_travado
    fase: 6
    script: skills/image-ai-generator/scripts/fidelity.py (gate embutido no generate.py via --lock) + skills/image-overlay/scripts/compose.py
    roda_em: [generate.py one-shot com --lock, step-07]
    bloqueia: "ARQUITETURA produto-travado (council 23/06): o produto NAO e re-renderizado. Rota COMPOSICAO (default) = compose.py cola o PNG travado (produtos-travados/SKU.json) e grava sidecar .lock.json -> fidelidade FORTE por proveniencia (hash), conferida no qa_imagem. Rota ONE-SHOT (excecao: slot 7 com pe, fallback lifestyle) = generate.py --lock roda disaster_check apos gravar (produto ausente -> reprova + move pra _rejeitado/); fidelidade fina = olho humano + inox_cast. PROIBIDO --edit p/ corrigir produto (edit-drift)."

# Hierarquia canonica das fotos: Equilibrado (Almir 2026-06-21).
# Fonte unica da verdade = SLOTS_CANONICOS em validators/validar_brief.py.
# Plano completo da blindagem: pipeline/STORYSELLING-ENFORCEMENT-PLAN.md
