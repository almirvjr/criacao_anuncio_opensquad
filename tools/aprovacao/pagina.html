<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprovar anúncios</title>
<style>
:root{--fundo:#f4f5f7;--cartao:#fff;--texto:#1d2330;--suave:#667085;--borda:#d8dce3;--ok:#127a3e;--erro:#b42318;--aviso:#9a6700;--acento:#2457c5;--fundoerro:#fdecea;--fundoaviso:#fff6db;--fundook:#e7f6ec}
@media (prefers-color-scheme:dark){:root{--fundo:#14171c;--cartao:#1d2128;--texto:#e7e9ee;--suave:#9aa3b2;--borda:#343a45;--ok:#5ccf8a;--erro:#ff8a80;--aviso:#f0c75e;--acento:#7aa2ff;--fundoerro:#3a1d1b;--fundoaviso:#3a3017;--fundook:#18321f}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1040px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:16px;margin-bottom:20px}
.topo{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.topo h2{font-size:17px;margin:0}
.sku{color:var(--suave);font-size:13px}
.selo{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--fundoaviso);color:var(--aviso)}
.selo.verde{background:var(--fundook);color:var(--ok)}
.selo.vermelho{background:var(--fundoerro);color:var(--erro)}
.topo .selo{font-size:14px;padding:4px 12px}
.faltas{border:1px solid var(--borda);border-radius:8px;padding:10px 14px;margin-top:12px}
.faltas b{display:block;margin-bottom:4px}
.faltas ul{list-style:none;padding:0;margin:0}
.faltas li{padding:3px 0}
.faltas li.feito{text-decoration:line-through;color:var(--suave)}
.faltas details{margin-top:6px;font-size:13px;color:var(--suave)}
.faltas summary{cursor:pointer;text-align:right}
.secao{margin-top:14px}
.secao>b{display:block;margin-bottom:6px}
.capas{display:flex;gap:6px;flex-wrap:wrap}
.capas img{width:64px;height:64px;object-fit:contain;background:#fff;border:1px solid var(--borda);border-radius:6px}
.capas img:first-child{width:96px;height:96px;border-color:var(--acento)}
label.opcao{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
label.opcao:hover{background:var(--fundo)}
.just{color:var(--suave);font-size:13px}
input[type=text],textarea{width:100%;font:inherit;color:inherit;background:var(--cartao);border:1px solid var(--borda);border-radius:6px;padding:7px 9px}
input.preco{max-width:180px;font-size:17px;font-weight:600}
textarea{min-height:110px;resize:vertical}
.conta{font-size:12px;color:var(--suave);text-align:right}
.conta.passou{color:var(--erro);font-weight:600}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.linha2{grid-template-columns:1fr}}
.rolar{overflow-x:auto}
table{border-collapse:collapse;font-size:14px}
td{padding:4px 12px 4px 0;vertical-align:top}
table.ficha td:first-child{color:var(--suave)}
table.cores td{border-bottom:1px solid var(--borda)}
.vermelho{color:var(--erro);font-weight:600}
ul.conf{list-style:none;padding:0;margin:0}
ul.conf li{padding:6px 8px;border-radius:6px;margin-bottom:4px}
li.bloqueio,li.erro{background:var(--fundoerro);color:var(--erro)}
li.aviso{background:var(--fundoaviso);color:var(--aviso)}
li.tudook{background:var(--fundook);color:var(--ok)}
.quadro{border:1px solid var(--aviso);background:var(--fundoaviso);border-radius:8px;padding:8px 12px}
.quadro .item{margin-bottom:10px}
.botoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--borda);background:var(--cartao);color:var(--texto);cursor:pointer}
button.principal{background:var(--acento);border-color:var(--acento);color:#fff}
button.principal.mesmo{background:var(--erro);border-color:var(--erro)}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--acento)}
.feito{background:var(--fundook);color:var(--ok);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.falha{background:var(--fundoerro);color:var(--erro);border-radius:8px;padding:8px 12px}
.vazio{color:var(--suave);padding:40px 0;text-align:center}
</style>
</head>
<body>
<main>
<h1>Anúncios esperando você</h1>
<div id="feitos"></div>
<div id="lista"><p class="vazio">Carregando…</p></div>
</main>
<script>
const TETO_TITULO = 60, TETO_MODELO = 30;
const BLOCOS = {bloco_1_abertura: "Abertura", bloco_2_specs: "Medidas e materiais", bloco_3_features_beneficios: "Benefícios"};
const CAMPOS = {VOLUME_CAPACITY: "Capacidade", UNITS_PER_PACK: "Unidades", MATERIAL: "Material", COLOR: "Cor",
  STRUCTURE_MATERIALS: "Material do corpo", LID_MATERIAL: "Material da tampa", WASTE_BASKET_OPENING_TYPES: "Tipo de abertura",
  HEIGHT: "Altura", WIDTH: "Largura", LENGTH: "Comprimento", DIAMETER: "Diâmetro", GTIN: "Código de barras"};

function el(tag, attrs = {}, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const f of filhos.flat()) if (f != null) e.append(f instanceof Node ? f : document.createTextNode(String(f)));
  return e;
}
// senha de uso unico que o servidor embute ao entregar esta pagina; sem ela a API recusa
const TELA_TOKEN = "__TELA_TOKEN__";
async function api(caminho, corpo) {
  const cab = {"X-Tela-Token": TELA_TOKEN};
  const r = await fetch(caminho, corpo ? {method: "POST", headers: {...cab, "Content-Type": "application/json"}, body: JSON.stringify(corpo)} : {headers: cab});
  const d = await r.json();
  if (!r.ok) throw new Error(d.erro || ("Erro " + r.status));
  return d;
}
// so link http(s): o link de concorrente vem de fora, e "javascript:" rodaria dentro desta tela
function linkSeguro(u) {
  try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; }
}
const ancora = (u, texto) => { const l = linkSeguro(u); return l ? el("a", {href: l, target: "_blank", rel: "noopener noreferrer"}, texto) : null; };
// mesma regra do servidor (aprovacao.ler_preco): ultimo separador com 1-2 casas = decimal; "1.299" = milhar
function lerPreco(s) {
  let t = String(s || "").replace(/[^\d,.\-]/g, "");
  if (t.includes(",") && t.includes(".")) {
    const dec = t.lastIndexOf(",") > t.lastIndexOf(".") ? "," : ".";
    t = t.split(dec === "," ? "." : ",").join("").replace(dec, ".");
  } else if (t.includes(",")) t = t.replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.split(".").join("");
  const v = Math.round(parseFloat(t) * 100) / 100;
  return isFinite(v) && v > 0 ? v : null;
}
const reais = v => v.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const hora = () => new Date().toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});

function contador(input, teto) {
  const c = el("div", {class: "conta"});
  const at = () => { c.textContent = `${input.value.length}/${teto}`; c.classList.toggle("passou", input.value.length > teto); };
  input.addEventListener("input", at); at();
  return c;
}

function topo(c, selo) {
  return el("div", {class: "topo"},
    el("div", {}, el("h2", {}, c.nome_base),
      el("div", {class: "sku"}, c.pai_sku, " · ",
        el("span", {title: c.categoria || ""}, c.categoria_curta || c.categoria || "categoria não escolhida"),
        " · ", c.tipo_anuncio || "Clássico")),
    selo || null);
}

// "O que falta": preço, título e conferência se marcam sozinhos; o que veio da revisão, à mão.
function oQueFalta(c) {
  const selo = el("span", {class: "selo"});
  const autos = el("ul");
  const manuais = (c.faltas_revisao || []).map(f => {
    const cb = el("input", {type: "checkbox"});
    const li = el("li", {}, el("label", {}, cb, " ", f, el("span", {class: "just"}, " (revisão)")));
    return {cb, li};
  });
  const p = c.parecer;
  const detalhes = p ? el("details", {}, el("summary", {}, "ver revisão completa"),
    el("div", {}, `Revisão: ${p.status || "—"}${p.score != null ? " (" + p.score + "/100)" : ""}`),
    p.resumo ? el("div", {}, p.resumo) : null) : null;
  const caixa = el("div", {class: "faltas"}, el("b", {}, "O que falta"), autos,
    el("ul", {}, manuais.map(m => m.li)), detalhes);
  let ultimoEstado = {};
  function atualizar(est) {
    if (est) ultimoEstado = est;
    const e = ultimoEstado;
    const pend = [];
    if (!e.preco) pend.push("Digitar o preço");
    if (!e.titulo) pend.push("Escolher o título (até 60 letras)");
    if (e.bloqueio || e.erro) pend.push("Resolver o que está em vermelho na Conferência, lá embaixo");
    autos.replaceChildren(...pend.map(x => el("li", {}, "☐ " + x)));
    manuais.forEach(m => m.li.classList.toggle("feito", m.cb.checked));
    const n = pend.length + manuais.filter(m => !m.cb.checked).length;
    selo.className = "selo " + (e.bloqueio ? "vermelho" : n ? "" : "verde");
    selo.textContent = e.bloqueio ? "⛔ Tem bloqueio" : n === 0 ? "✅ Pronto pra publicar" : n === 1 ? "⚠ Falta 1 coisa" : `⚠ Faltam ${n} coisas`;
    caixa.style.display = n ? "" : "none";
  }
  manuais.forEach(m => m.cb.addEventListener("change", () => atualizar()));
  return {selo, caixa, atualizar};
}

// Resumo depois de publicar: link de cada cor, descrição e Flex, e "Tentar de novo" na cor que falhou.
function resumoPublicacao(c, itens) {
  return el("div", {class: "secao"}, el("b", {}, "Publicação"), el("ul", {class: "conf"}, itens.map(i => linhaPublicacao(c, i))));
}
function linhaPublicacao(c, i) {
  if (i.ok) return el("li", {class: "tudook"}, `✅ ${i.cor || i.sku}: `, (ancora(i.link, i.mlb) || i.mlb),
    ` · descrição ${i.descricao ? "✅" : "❌"} · Flex ${i.flex ? "✅" : "❌"} · garantia 30 dias ${i.garantia ? "✅" : "❌"} · loja oficial ${i.loja_oficial ? "✅" : "❌"} · fica pausado até o ML baixar a foto (5 a 15 min), é normal`,
    i.erro ? el("div", {}, i.erro) : null);
  const bt = el("button", {}, "Tentar de novo");
  const li = el("li", {class: "erro"}, `❌ ${i.cor || i.sku}: ${i.erro || "não publicado"} `, bt);
  bt.addEventListener("click", async () => {
    bt.disabled = true;
    try {
      const r = await api("/api/tentar", {pai: c.pai_sku, sku: i.sku});
      li.replaceWith(linhaPublicacao(c, r.item));
    } catch (e) { li.append(el("div", {}, "Falhou de novo: " + e.message)); bt.disabled = false; }
  });
  return li;
}

function tabelaCores(c, tituloAtual, aoReler) {
  const linhas = c.cores.map(v => {
    const ean = el("td", {});
    const mostrarEan = () => {
      if (v.ean) { ean.replaceChildren(v.ean); return; }
      const bt = el("button", {}, "Reler do Olist");
      bt.addEventListener("click", async () => {
        bt.disabled = true;
        try {
          const r = await api("/api/reler-ean", {pai: c.pai_sku, sku: v.sku});
          if (r.ok) { v.ean = r.ean; mostrarEan(); aoReler(); }
          else { ean.replaceChildren(el("div", {class: "vermelho"}, r.motivo), bt); bt.disabled = false; }
        } catch (e) { ean.append(el("div", {class: "vermelho"}, e.message)); bt.disabled = false; }
      });
      ean.replaceChildren(el("div", {class: "vermelho"}, "sem código"), bt);
    };
    mostrarEan();
    const tit = el("td", {});
    v._atualiza = () => {
      const t = (tituloAtual() + (v.cor ? " " + v.cor : "")).trim();
      // o teto de 60 vale para o nome escolhido; nome + cor pode passar (o ML aceitou 66 em 08/10)
      tit.replaceChildren(t, el("div", {class: "just"}, `${t.length} letras`));
    };
    v._atualiza();
    return el("tr", {}, el("td", {}, v.cor || "—"), el("td", {class: "sku"}, v.sku), ean,
      el("td", {}, v.capas.length ? el("div", {class: "capas"}, v.capas.map((u, i) =>
        el("img", {src: u, alt: i === 0 ? "capa principal" : `foto ${i + 1}`, title: i === 0 ? "capa principal" : `foto ${i + 1}`})))
        : el("span", {class: "vermelho"}, "sem foto")),
      el("td", {}, v.estoque ?? "vem do Olist"), tit);
  });
  return el("div", {class: "rolar"}, el("table", {class: "cores"},
    el("tr", {}, ["Cor", "SKU", "Código de barras", "Fotos (a 1ª é a capa)", "Estoque", "Título que o ML vai montar"].map(h => el("td", {}, el("b", {}, h)))),
    linhas));
}

function quadroFaltou(c) {
  const decisoes = c.quadro.map(q => {
    const nome = "q_" + c.pai_sku + "_" + q.chave;
    const proprio = el("input", {type: "text", placeholder: "escrever outro valor"});
    const opcoes = q.fontes.map(f => el("label", {class: "opcao"}, el("input", {type: "radio", name: nome, value: f.valor}),
      el("span", {}, `${f.valor} `, el("span", {class: "just"}, `(${f.origem})`), ancora(f.link, " ver"))));
    const rProprio = el("input", {type: "radio", name: nome, value: "__proprio__"});
    const rNsa = el("input", {type: "radio", name: nome, value: "não se aplica"});
    const rVazio = el("input", {type: "radio", name: nome, value: ""});
    rVazio.checked = true;
    proprio.addEventListener("focus", () => { rProprio.checked = true; });
    const bloco = el("div", {class: "item"},
      el("b", {}, `${q.rotulo} — ${q.status === "pendente" ? "ninguém achou" : "as fontes discordam"}`),
      opcoes, el("label", {class: "opcao"}, rProprio, el("span", {style: "flex:1"}, proprio)),
      el("label", {class: "opcao"}, rNsa, el("span", {}, "não se aplica ", el("span", {class: "just"}, "(o campo não faz sentido pra este produto)"))),
      el("label", {class: "opcao"}, rVazio, el("span", {}, "deixar vazio")),
      el("div", {class: "just"}, q.campo_ficha ? `vai para a ficha técnica (${CAMPOS[q.campo_ficha] || q.campo_ficha})`
        : "não tem campo na ficha deste anúncio; se quiser no texto, edite a descrição"));
    return {bloco, ler: () => {
      const sel = bloco.querySelector(`input[name="${CSS.escape(nome)}"]:checked`);
      let valor = !sel ? "" : sel.value === "__proprio__" ? proprio.value.trim() : sel.value;
      if (valor && q.unidade && !/[a-z]/i.test(valor)) valor = `${valor} ${q.unidade}`;
      return {chave: q.chave, valor, campo_ficha: q.campo_ficha};
    }};
  });
  const caixa = decisoes.length ? el("div", {class: "secao quadro"},
    el("b", {}, "Faltou ou divergiu — você decide"), decisoes.map(d => d.bloco)) : null;
  return {caixa, ler: () => decisoes.map(d => d.ler())};
}

function cartao(c) {
  if (c.erro) return el("div", {class: "cartao"}, el("b", {}, c.arquivo), el("p", {class: "falha"}, c.erro + " Chame o Claude."));
  if (c.parado) {
    const cx = el("div", {class: "cartao"});
    const bt = el("button", {}, "Tirar do lote");
    bt.addEventListener("click", async () => {
      bt.disabled = true;
      try { await api("/api/tirar", {pai: c.pai_sku}); feito(`✖ ${c.pai_sku} tirado do lote`); cx.remove(); vazio(); }
      catch (e) { cx.append(el("p", {class: "falha"}, "Não gravou: " + e.message)); bt.disabled = false; }
    });
    cx.append(el("h2", {}, c.pai_sku), el("p", {class: "falha"}, "Parou na esteira: " + c.parado),
      el("p", {class: "just"}, "Este produto não pode ser publicado assim. Corrija o motivo e coloque a planilha de novo, ou tire do lote para o resto seguir."),
      el("div", {class: "botoes"}, bt));
    return cx;
  }
  if (c.situacao === "em_parte") {
    const cx = el("div", {class: "cartao"});
    const bt = el("button", {}, "Tirar do lote");
    bt.addEventListener("click", async () => {
      bt.disabled = true;
      try { await api("/api/tirar", {pai: c.pai_sku}); feito(`✖ ${c.nome_base}: o que faltava foi tirado do lote (as cores no ar continuam no ar)`); cx.remove(); vazio(); }
      catch (e) { cx.append(el("p", {class: "falha"}, "Não gravou: " + e.message)); bt.disabled = false; }
    });
    cx.append(topo(c),
      el("p", {class: "just"}, "Este anúncio já foi aprovado e publicado em parte. Tente de novo a cor que falta, ou tire do lote."),
      resumoPublicacao(c, c.publicacao_por_cor || c.publicacao), el("div", {class: "botoes"}, bt));
    return cx;
  }

  const nomeRadio = "t_" + c.pai_sku;
  const proprio = el("input", {type: "text", placeholder: "Escreva o seu título"});
  const opcoes = c.titles.map(t => {
    const r = el("input", {type: "radio", name: nomeRadio, value: t.texto});
    if (t.texto === c.titulo_inicial) r.checked = true;
    return el("label", {class: "opcao"}, r,
      el("span", {}, `${t.texto} (${t.texto.length})`, t.recomendado ? " ⭐ recomendado" : "", el("br"), el("span", {class: "just"}, t.justificativa)));
  });
  const rProprio = el("input", {type: "radio", name: nomeRadio, value: "__proprio__"});
  if (!c.titles.some(t => t.texto === c.titulo_inicial)) { rProprio.checked = true; proprio.value = c.titulo_inicial || ""; }
  proprio.addEventListener("focus", () => { rProprio.checked = true; mudou(); });
  const contaProprio = contador(proprio, TETO_TITULO);

  const marca = el("input", {type: "text", value: c.marca});
  const modelo = el("input", {type: "text", value: c.modelo});
  const preco = el("input", {type: "text", class: "preco", inputmode: "decimal", placeholder: "ex.: 129,90",
    value: c.preco != null ? String(c.preco).replace(".", ",") : ""});
  const vaiPor = el("div", {class: "just"});
  const caixas = {};
  const crescer = t => { t.style.height = "auto"; t.style.height = (t.scrollHeight + 4) + "px"; };
  for (const [k, v] of Object.entries(c.descricao)) { const t = el("textarea", {}); t.value = v; t.addEventListener("input", () => crescer(t)); caixas[k] = t; }
  const quadro = quadroFaltou(c);

  const conf = el("ul", {class: "conf"}, el("li", {}, "Conferindo…"));
  const btAprovar = el("button", {class: "principal"}, "Aprovar e publicar");
  const nota = el("input", {type: "text", placeholder: "O que a Renata deve refazer?"});
  const btDevolver = el("button", {}, "Devolver pra refazer");
  const btTirar = el("button", {}, "Tirar do lote");
  const msg = el("div");

  const titulo = () => {
    const sel = caixa.querySelector(`input[name="${CSS.escape(nomeRadio)}"]:checked`);
    return !sel ? "" : sel.value === "__proprio__" ? proprio.value : sel.value;
  };
  const edicao = () => ({titulo: titulo(), marca: marca.value, modelo: modelo.value, preco: preco.value,
    decisoes: quadro.ler(), descricao: Object.fromEntries(Object.entries(caixas).map(([k, t]) => [k, t.value]))});

  let espera, ultimo = [], seq = 0, publicando = false;
  const falta = oQueFalta(c);
  function botao() {
    const v = lerPreco(preco.value);
    const tit = titulo().trim();
    falta.atualizar({preco: !!v, titulo: !!tit && tit.length <= TETO_TITULO,
      bloqueio: ultimo.some(i => i.nivel === "bloqueio"), erro: ultimo.some(i => i.nivel === "erro")});
    vaiPor.textContent = preco.value.trim() ? (v ? `Vai publicar por ${reais(v)}` : "Esse preço não foi entendido") : "";
    if (publicando) { btAprovar.disabled = true; return; }
    const bloq = ultimo.some(i => i.nivel === "bloqueio"), errado = ultimo.some(i => i.nivel === "erro");
    const semPreco = !lerPreco(preco.value);
    btAprovar.disabled = bloq || semPreco;
    btAprovar.textContent = bloq ? "Aprovar e publicar (corrija o bloqueio)" : semPreco ? "Aprovar e publicar (falta o preço)"
      : errado ? "Aprovar e publicar mesmo assim" : "Aprovar e publicar";
    btAprovar.classList.toggle("mesmo", errado && !bloq && !semPreco);
  }
  function mostrar(itens) {
    ultimo = itens;
    conf.replaceChildren(...(itens.length ? itens.map(i => el("li", {class: i.nivel},
      (i.nivel === "aviso" ? "⚠ " : "❌ ") + i.texto)) : [el("li", {class: "tudook"}, "✅ Tudo certo nas conferências")]));
    botao();
  }
  async function conferirAgora() {
    const meu = ++seq;
    try {
      const {itens} = await api("/api/conferir", {pai: c.pai_sku, edicao: edicao()});
      if (meu === seq) mostrar(itens);
    } catch (e) { conf.replaceChildren(el("li", {class: "erro"}, "A conferência falhou: " + e.message)); btAprovar.disabled = true; }
  }
  function mudou() {
    c.cores.forEach(v => v._atualiza && v._atualiza());
    clearTimeout(espera); espera = setTimeout(conferirAgora, 400);
  }
  [proprio, marca, modelo, ...Object.values(caixas)].forEach(i => i.addEventListener("input", mudou));
  preco.addEventListener("input", botao);
  // trocou a Marca: a linha "Marca: ..." da descricao acompanha (08/10)
  marca.addEventListener("input", () => {
    for (const t of Object.values(caixas)) {
      const novo = t.value.replace(/^(\s*[-•]?\s*Marca:[ \t]*).*$/gim, (_, ini) => ini + marca.value.trim());
      if (novo !== t.value) { t.value = novo; crescer(t); }
    }
  });

  const caixa = el("div", {class: "cartao"});
  btAprovar.addEventListener("click", async () => {
    publicando = true;
    btAprovar.disabled = true; btTirar.disabled = true; btDevolver.disabled = true;
    btAprovar.textContent = "Publicando… (não feche a página)";
    try {
      clearTimeout(espera); seq++;
      const vistos = ultimo.map(i => i.codigo);
      const r = await api("/api/aprovar", {pai: c.pai_sku, edicao: edicao(), vistos});
      if (!r.ok) {
        publicando = false;
        if (r.conferencia && r.conferencia.length) mostrar(r.conferencia); else botao();
        btTirar.disabled = false; btDevolver.disabled = false;
        msg.replaceChildren(el("p", {class: "falha"}, r.motivo)); return;
      }
      const itens = r.publicacao || [];
      const tudo = itens.length && itens.every(i => i.ok);
      feito(`${tudo ? "✅" : "⚠"} ${c.nome_base} ${tudo ? "publicado" : "publicado em parte"} às ${hora()}`);
      caixa.classList.add("publicado");
      caixa.replaceChildren(topo(c), resumoPublicacao(c, itens));
      vazio();
    } catch (e) {
      msg.replaceChildren(el("p", {class: "falha"}, "Não terminou: " + e.message + ". Recarregue a página: o que já foi publicado não é publicado de novo."));
      publicando = false; botao(); btTirar.disabled = false; btDevolver.disabled = false;
    }
  });
  btDevolver.addEventListener("click", async () => {
    btDevolver.disabled = true;
    try {
      const r = await api("/api/devolver", {pai: c.pai_sku, nota: nota.value});
      if (!r.ok) { msg.replaceChildren(el("p", {class: "falha"}, r.motivo)); btDevolver.disabled = false; return; }
      feito(`↩ ${c.nome_base} devolvido para refazer o texto — o cartão volta quando estiver pronto`); caixa.remove(); vazio();
    } catch (e) { msg.replaceChildren(el("p", {class: "falha"}, "Não gravou: " + e.message)); btDevolver.disabled = false; }
  });
  btTirar.addEventListener("click", async () => {
    btTirar.disabled = true;
    try {
      await api("/api/tirar", {pai: c.pai_sku});
      feito(`✖ ${c.nome_base} tirado do lote (não será publicado agora)`); caixa.remove(); vazio();
    } catch (e) { msg.replaceChildren(el("p", {class: "falha"}, "Não gravou: " + e.message)); btTirar.disabled = false; }
  });
  caixa.addEventListener("change", e => { if (e.target.type === "radio" && e.target.name === nomeRadio) mudou(); });

  const ficha = el("table", {class: "ficha"}, Object.entries(c.ficha).map(([k, v]) => el("tr", {}, el("td", {}, CAMPOS[k] || k), el("td", {}, String(v)))));
  const cx = c.caixa_cm || {};

  caixa.append(
    topo(c, falta.selo), falta.caixa,
    el("div", {class: "secao"}, el("b", {}, "Cores"), tabelaCores(c, titulo, conferirAgora)),
    el("div", {class: "secao"}, el("b", {}, "Preço"), preco, vaiPor, el("div", {class: "just"}, "Vale para todas as cores. Sem preço o anúncio não sai.")),
    el("div", {class: "secao"}, el("b", {}, "Título (vira o nome do anúncio; o ML acrescenta a cor)"), opcoes,
      el("label", {class: "opcao"}, rProprio, el("span", {style: "flex:1"}, proprio, contaProprio))),
    el("div", {class: "secao linha2"},
      el("div", {}, el("b", {}, "Marca"), marca, contador(marca, TETO_MODELO),
        el("div", {class: "just"}, "Vem o fornecedor (ou Terra Casa Decor); se digitar outra, vale a sua. A linha \"Marca:\" da descrição muda junto.")),
      el("div", {}, el("b", {}, "Modelo"), modelo, contador(modelo, TETO_MODELO),
        el("div", {class: "just"}, "Palavras de busca que não estão no título."))),
    quadro.caixa,
    el("div", {class: "secao"}, el("b", {}, "Descrição"),
      Object.entries(caixas).map(([k, t]) => el("div", {style: "margin-bottom:8px"}, el("div", {class: "just"}, BLOCOS[k] || k), t))),
    el("div", {class: "secao linha2"},
      el("div", {}, el("b", {}, "Ficha técnica"), el("div", {class: "rolar"}, ficha)),
      el("div", {}, el("b", {}, "Envio"),
        el("div", {}, `Peso: ${c.peso_kg ?? "—"} kg`), el("div", {}, `Caixa: ${cx.largura ?? "—"} × ${cx.altura ?? "—"} × ${cx.comprimento ?? "—"} cm`),
        el("div", {}, "Frete grátis: o ML liga sozinho nessa faixa de preço"), el("div", {}, "Flex: ligado logo depois de publicar"),
        el("div", {}, "Anúncio clássico, na loja oficial da Terra, garantia do vendedor de 30 dias"))),
    c.observacoes.length ? el("div", {class: "secao"}, el("b", {}, "Observações da Renata"), el("ul", {}, c.observacoes.map(o => el("li", {}, o)))) : null,
    el("div", {class: "secao"}, el("b", {}, "Conferência"), conf),
    el("div", {class: "botoes"}, btAprovar, btTirar, el("span", {style: "flex:1"}), nota, btDevolver),
    msg);
  requestAnimationFrame(() => Object.values(caixas).forEach(crescer));
  c.cores.forEach(v => v._atualiza());  // a tabela nasce antes das opcoes de titulo: recalcula agora
  conferirAgora();
  return caixa;
}

const lista = document.getElementById("lista");
function feito(t) { document.getElementById("feitos").append(el("div", {class: "feito"}, t)); }
function vazio() {
  if (!lista.querySelector(".cartao:not(.publicado)")) {
    lista.querySelectorAll(".vazio").forEach(v => v.remove());
    lista.append(el("p", {class: "vazio"}, "Nada esperando você. Pode fechar esta página."));
  }
}

api("/api/pendentes").then(({cartoes}) => {
  lista.replaceChildren(...cartoes.map(cartao)); vazio();
}).catch(e => lista.replaceChildren(el("p", {class: "falha"}, "A tela não conseguiu ler os anúncios: " + e.message + ". A janela preta está aberta?")));
</script>
</body>
</html>
