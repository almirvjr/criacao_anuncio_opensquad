<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BADGE_TAMANHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:1200px}
  .canvas{position:relative;width:1200px;height:1200px;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#1a1a1a}
  .bg{position:absolute;inset:0;width:1200px;height:1200px;object-fit:cover;z-index:0}
  .headline:empty,.subheadline:empty,.badge:empty,.brand:empty{display:none!important}
  /* BADGE_TAMANHO: headline topo 44px, sub 22px, badge canto inferior direito (pill verde) */
  .layer-top{position:absolute;top:0;left:0;right:0;padding:48px;z-index:2}
  .headline{font-size:44px;font-weight:800;color:#fff;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,0.35)}
  .subheadline{font-size:22px;font-weight:500;color:#fff;margin-top:12px;text-shadow:0 2px 8px rgba(0,0,0,0.35)}
  .badge{position:absolute;right:48px;bottom:48px;background:#2d8a4a;color:#fff;font-size:22px;font-weight:700;padding:16px 28px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,0.25);z-index:3}
  .brand{position:absolute;bottom:48px;left:48px;font-size:16px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.4);z-index:2}
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="{{BACKGROUND_IMAGE}}" alt="">
    <div class="layer-top">
      <div class="headline">{{HEADLINE}}</div>
      <div class="subheadline">{{SUBHEADLINE}}</div>
    </div>
    <div class="badge">{{BADGE}}</div>
    <div class="brand">{{BRAND_SIGNATURE}}</div>
  </div>
</body>
</html>
