<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DETALHE_TECNICO_DURABILIDADE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:1200px}
  .canvas{position:relative;width:1200px;height:1200px;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#1a1a1a}
  .bg{position:absolute;inset:0;width:1200px;height:1200px;object-fit:cover;z-index:0}
  .headline:empty,.brand:empty{display:none!important}
  /* DETALHE_TECNICO_DURABILIDADE: somente headline topo 38px */
  .layer-top{position:absolute;top:48px;left:48px;right:48px;z-index:2}
  .headline{font-size:38px;font-weight:700;color:#fff;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,0.4)}
  .brand{position:absolute;bottom:48px;left:48px;font-size:16px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.4);z-index:2}
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="{{BACKGROUND_IMAGE}}" alt="">
    <div class="layer-top">
      <div class="headline">{{HEADLINE}}</div>
    </div>
    <div class="brand">{{BRAND_SIGNATURE}}</div>
  </div>
</body>
</html>
